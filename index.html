<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Para ti</title>

<!--
  ─────────────────────────────────────────────────────────────
  CÓMO PERSONALIZAR
  Pon en ESTA MISMA CARPETA, junto a carta.html:
      cancion.mp3
      foto1.jpg   foto2.jpg   foto3.jpg
      foto4.jpg   foto5.jpg   foto6.jpg
  Si no pones alguna, el marco queda vacío y te dice cuál falta.
  Para cambiar textos, pies de foto, nombres de archivo o añadir
  más fotos a una sección, edita el bloque CONFIG (más abajo).
  ─────────────────────────────────────────────────────────────
-->

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petit+Formal+Script&family=Karla:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#F4FAFC;            /* fondo, casi blanco */
    --white:#FFFFFF;
    --white-bg:rgba(255,255,255,0.8);
    --blue:#1E93CE;          /* acciones */
    --blue-deep:#0E5C86;     /* títulos */
    --blue-soft:#DCEEF8;
    --line:#DDEAF2;
    --ink:#2F5668;           /* texto */
    --magenta:#E34B8F;       /* acento */
    --orange:#F2913A;        /* acento */
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html{scroll-behavior:auto}
  html.abierta{scroll-snap-type:y mandatory}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Karla',system-ui,sans-serif;
    font-size:17px;line-height:1.7;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  body:not(.abierta){overflow:hidden;height:100dvh}

  /* ── hojas cayendo ─────────────────────────────── */
  #fall{position:fixed;inset:0;pointer-events:none;z-index:1;overflow:hidden}
  .fl{
    position:absolute;top:-10vh;opacity:0;
    will-change:transform,opacity;
    animation:drop var(--dur) linear forwards;
  }
  .fl .sw{animation:sway var(--swd) ease-in-out infinite}
  .fl .sp{animation:spin var(--dur) linear forwards}
  .fl .sw,.fl .sp{width:100%;height:100%;will-change:transform}
  .fl svg{display:block}
  @keyframes drop{
    0%{opacity:0;transform:translate3d(0,0,0)}
    8%{opacity:1} 88%{opacity:1}
    100%{opacity:0;transform:translate3d(var(--dx),118vh,0)}
  }
  @keyframes sway{
    0%,100%{transform:translate3d(calc(var(--sw) * -1),0,0)}
    50%{transform:translate3d(var(--sw),0,0)}
  }
  @keyframes spin{
    from{transform:rotate(0deg)}
    to{transform:rotate(var(--spin))}
  }

  /* ── portada ───────────────────────────────────── */
  #cover{
    position:fixed;inset:0;z-index:3;
    background:var(--bg);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:28px 22px;
    transition:opacity .9s ease;
  }
  #cover.gone{opacity:0;pointer-events:none}

  /* ── pliego que se abre desde abajo ────────────── */
  #fold{
    position:fixed;inset:0;z-index:4;
    perspective:1500px;pointer-events:none;display:none;
    transition:opacity .85s ease;
  }
  #fold.on{display:block}
  #fold.away{opacity:0}
  #fold .sheet{
    position:absolute;inset:0;
    background:linear-gradient(to top,#1580B8,var(--blue) 55%);
    transform-origin:bottom center;
    transform:rotateX(-84deg);
    transition:transform 1.15s cubic-bezier(.3,.72,.3,1);
    will-change:transform;
    backface-visibility:hidden;
  }
  #fold.up .sheet{transform:rotateX(0deg)}
  #fold .sheet::after{
    content:"";position:absolute;left:8%;right:8%;bottom:0;height:1px;
    background:linear-gradient(to right,transparent,rgba(255,255,255,.6),transparent);
  }

  /* ── secciones ─────────────────────────────────── */
  .sec{
    scroll-snap-align:center;
    min-height:100dvh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;
    padding:76px 22px;
    position:relative;z-index:2;
  }
  .sec > *{
    opacity:0;transform:translateY(16px);
    transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.3,1);
  }
  .sec.seen > *{opacity:1;transform:none}
  .sec.seen > *:nth-child(2){transition-delay:.1s}
  .sec.seen > *:nth-child(3){transition-delay:.18s}
  .sec.seen > *:nth-child(4){transition-delay:.26s}
  .sec.seen > *:nth-child(5){transition-delay:.34s}

  /* ── tarjeta blanca de cada sección ────────────── */
  .card{
    width:100%;max-width:560px;
    background:var(--white-bg);
    border-radius:26px;
    border:1px solid #E8F2F8;
    padding:clamp(30px,6vw,48px) clamp(22px,5vw,38px);
    box-shadow:0 14px 38px rgba(21,90,130,.10);
  }

  /* ── portada sobre turquesa ────────────────────── */
  #cover .script{color:var(--blue-deep)}
  #cover .over{color:var(--blue)}
  #cover p.body{color:var(--ink)}

  /* ── tipografía ────────────────────────────────── */
  .script{
    font-family:'Petit Formal Script',cursive;color:var(--blue-deep);
    font-size:clamp(34px,8.5vw,52px);line-height:1.25;font-weight:400;
  }
  .script.sm{font-size:clamp(27px,6.5vw,38px)}
  .over{
    font-family:'Petit Formal Script',cursive;
    font-size:clamp(19px,4.5vw,22px);color:var(--blue);margin-bottom:6px;
  }
  p.body{max-width:42ch;margin:16px auto 0;color:var(--ink)}
  hr.rule{width:46px;height:3px;border-radius:3px;background:var(--blue);margin:22px auto;border:0}

  /* ── corazón de hojas ──────────────────────────── */
  .heart{
    position:relative;width:min(320px,74vw);aspect-ratio:1/.94;
    margin:0 auto 4px;
  }
  .heart .hl{
    position:absolute;transform-origin:50% 50%;opacity:0;
    animation:bloom .8s cubic-bezier(.2,.8,.3,1) both;
  }
  @keyframes bloom{
    from{opacity:0;transform:translate(-50%,-50%) rotate(var(--rot)) scale(.2)}
    to{opacity:1;transform:translate(-50%,-50%) rotate(var(--rot)) scale(1)}
  }
  .heart.mini{width:min(165px,44vw);margin-bottom:12px}

  /* ── espacios para fotos ───────────────────────── */
  .shots{
    display:flex;gap:14px;justify-content:center;flex-wrap:wrap;
    margin-top:26px;
  }
  .frame{
    width:148px;aspect-ratio:4/5;
    max-height:30vh;
    background:var(--blue-soft);
    border:1px solid var(--line);border-radius:10px;
    overflow:hidden;
    display:flex;align-items:center;justify-content:center;
    transform:rotate(var(--tilt));
  }
  .shots.one .frame{width:min(268px,70vw);max-height:42vh}
  .frame img{width:100%;height:100%;object-fit:cover;display:block}
  .frame .miss{font-size:12.5px;color:#7FA0B5;padding:0 14px;line-height:1.55}
  .frame .miss b{font-weight:500;color:var(--blue-deep)}
  .shot .cap{
    font-family:'Petit Formal Script',cursive;
    font-size:17px;color:var(--blue-deep);margin-top:9px;display:block;
  }

  /* ── controles ─────────────────────────────────── */
  .btn{
    display:inline-flex;align-items:center;gap:9px;margin-top:30px;
    padding:13px 28px;background:var(--blue);color:var(--white);
    border:0;border-radius:999px;
    font-family:'Karla',sans-serif;font-size:16px;cursor:pointer;
    transition:background .25s ease,transform .25s ease;
  }
  .btn:hover{background:#1580B8;transform:translateY(-2px)}
  .btn.ghost{
    background:none;color:var(--blue-deep);border:1px solid var(--line);
    padding:11px 22px;font-size:15px;
  }
  .btn.ghost:hover{background:var(--blue-soft);color:var(--blue)}

  .hint{
    position:absolute;bottom:26px;left:50%;transform:translateX(-50%);
    color:#8AA9B8;font-size:14px;
    display:flex;flex-direction:column;align-items:center;gap:5px;
    transition:opacity .6s ease;
  }
  .hint.off{opacity:0}
  .hint svg{animation:nudge 1.9s ease-in-out infinite}
  @keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(5px)}}

  .aviso{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);
    z-index:5;max-width:88vw;
    background:var(--white);border:1px solid var(--line);border-radius:8px;
    padding:10px 16px;font-size:13.5px;color:var(--ink);
    transition:opacity .5s ease;
  }
  .aviso.off{opacity:0}

  .sound{
    position:fixed;top:18px;right:18px;z-index:4;
    width:42px;height:42px;border-radius:50%;
    background:var(--white);border:1px solid var(--line);
    display:none;align-items:center;justify-content:center;
    cursor:pointer;color:var(--blue-deep);
    transition:color .2s ease,border-color .2s ease;
  }
  .sound.show{display:flex}
  .sound:hover{color:var(--blue);border-color:var(--blue)}
  .sound .off{display:none}
  .sound.muted .on{display:none}
  .sound.muted .off{display:block}

  :focus-visible{outline:2px solid var(--blue);outline-offset:3px}

  @media (max-width:420px){ .frame{width:132px} }

  @media (prefers-reduced-motion:reduce){
    html{scroll-behavior:auto}
    #fall{display:none}
    .sec > *{opacity:1;transform:none;transition:none}
    .heart .hl{animation:none;opacity:1;transform:translate(-50%,-50%) rotate(var(--rot))}
    .hint svg{animation:none}
  }
</style>
</head>
<body>

<div id="fall" aria-hidden="true"></div>

<button class="sound" id="sound" aria-label="Silenciar música">
  <svg class="on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9H5z"/><path d="M17.5 9a4 4 0 0 1 0 6"/></svg>
  <svg class="off" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 9v6h4l5 4V5L9 9H5z"/><path d="M18 10l4 4M22 10l-4 4"/></svg>
</button>

<section id="cover"></section>
<div id="fold" aria-hidden="true"><div class="sheet"></div></div>
<main id="carta"></main>

<audio id="audio" loop preload="auto"></audio>

<script>
/* ═══════════════════════════════════════════════════
   CONFIG — textos, fotos y canción
   Cada sección puede llevar "fotos": pon 1, 2 o 3.
   Los archivos van al lado de carta.html.
   ═══════════════════════════════════════════════════ */
const CONFIG = {

  cancion: "./cancion.mp3",
  firma:   "Tuyo",                       // mejor si pones tu nombre

  portada: {
    encima: "Para ti",
    titulo: "Te escribí<br>esto",
    pie:    "Con mucho amor y cariño, cuando tengas un ratico.",
    boton:  "Ábrela"
  },

  paginas: [
    {
      encima: "Lo primero",
      titulo: "Gracias por estar",
      texto: [
        "Hay cosas que no te digo tanto como debería, y la primera es gracias.",
        "Gracias por tu paciencia, por tu compañía en los días comunes y especiales, por hacer que lo de siempre se sienta bonito solo porque estás a mi lado."
      ],
      fotos: [
        { src:"./foto1.jpg", pie:"Nosotros" }
      ]
    },
    {
      encima: "Nuestros momentos",
      titulo: "Me acuerdo de todo",
      texto: ["De las risas, de las conversaciones largas, de los planes que salieron y de los que no. Cada foto de estas me devuelve el día entero."],
      fotos: [
        { src:"./foto2.jpg", pie:"Este día" },
        { src:"./foto3.jpg", pie:"Nos reímos mucho" },
        { src:"./foto4.jpg", pie:"Mi favorita" }
      ]
    },
    {
      encima: "De ti",
      titulo: "Lo que admiro",
      texto: [
        "Tu manera de cuidar a los que quieres, incluso cuando vienes cansada.",
        "Tu risa, que me acomoda los días malos.",
        "Y esa fuerza tuya para seguir adelante, con los pies firmes y el corazón abierto."
      ],
      fotos: [
        { src:"./foto5.jpg", pie:"Tú" }
      ]
    },
    {
      encima: "En las buenas y en las otras",
      titulo: "También en las tormentas",
      texto: [
        "No todos los días van a ser fáciles, y no quiero prometerte un cielo despejado, y sé que no he estado el tiempo que en verdad necesitas que esté y lo siento por ello.",
        "Te prometo algo mejor: quedarme. Si el día viene gris, aquí estoy. Si toca llorar, te abrazo. Si toca esperar, espero contigo el tiempo que sea."
      ],
      fotos: [
        { src:"./foto6.jpg", pie:"Contigo" }
      ]
    },
    {
      encima: "Lo que quiero decirte",
      titulo: "Te amo sin condiciones",
      texto: [
        "Como tu novio y como tu amigo: para celebrarte cuando todo salga bien, para acompañarte cuando no salga nada y admirarte cuando brillas en el escenario.",
        "No tienes que estar fuerte, ni de buen ánimo, ni tenerlo todo resuelto. Te quiero y te amo igual, tal como eres, y aquí voy a seguir."
      ]
    }
  ],

  final: {
    titulo: "Gracias por tanto",
    texto:  "Te amo hoy, y en todo lo que venga."
  }
};

/* ═══════════════════════════════════════════════════
   Hojas (SVG)
   ═══════════════════════════════════════════════════ */
const PALETA = ["#1E93CE","#4FB3E0","#0E5C86","#2AA7C9","#7FCCEA","#E34B8F"];
const VETA   = "#FFFFFF";

function hoja(tipo, color){
  const v = c => `<svg viewBox="0 0 40 40" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">${c}</svg>`;
  switch(tipo){
    case "simple": return v(`
      <path d="M20 3C10 11 8 25 20 37C32 25 30 11 20 3Z" fill="${color}"/>
      <path d="M20 7V33M20 14l-5 3M20 14l5 3M20 21l-6 3M20 21l6 3" stroke="${VETA}" stroke-width="1.1" stroke-linecap="round" fill="none" opacity=".85"/>`);
    case "larga": return v(`
      <path d="M20 2C13 12 12 27 20 38C28 27 27 12 20 2Z" fill="${color}"/>
      <path d="M20 5V35" stroke="${VETA}" stroke-width="1" opacity=".8"/>
      <path d="M20 11l-4 4M20 11l4 4M20 19l-4.5 4M20 19l4.5 4M20 27l-4 3M20 27l4 3" stroke="${VETA}" stroke-width="1" stroke-linecap="round" opacity=".7" fill="none"/>`);
    case "roble": return v(`
      <path d="M20 2c3 1 4 3 5 5 3-1 5 1 4 4 3 1 4 4 1 6 3 2 2 5-1 6 2 3 0 6-3 6 0 4-3 5-6 3-3 2-6 1-6-3-3 0-5-3-3-6-3-1-4-4-1-6-3-2-2-5 1-6-1-3 1-5 4-4 1-2 2-4 5-5Z" fill="${color}"/>
      <path d="M20 6v28" stroke="${VETA}" stroke-width="1.1" opacity=".75"/>`);
    case "maple": return v(`
      <path d="M20 2l3.5 9.5L30 8l-1.5 7.5L37 14l-6.5 6L35 25l-7.5-.5.8 6.5L21.5 28 20 38l-1.5-10-6.8 3L12.5 24.5 5 25l4.5-5L3 14l8.5 1.5L10 8l6.5 3.5L20 2Z" fill="${color}"/>
      <path d="M20 12v20" stroke="${VETA}" stroke-width="1" opacity=".7"/>`);
    case "rama": return v(`
      <path d="M20 38C20 26 20 12 20 3" stroke="${color}" stroke-width="1.6" stroke-linecap="round" fill="none"/>
      <g fill="${color}">
        <ellipse cx="14" cy="12" rx="5" ry="2.6" transform="rotate(-28 14 12)"/>
        <ellipse cx="26" cy="16" rx="5" ry="2.6" transform="rotate(28 26 16)"/>
        <ellipse cx="14" cy="21" rx="5" ry="2.6" transform="rotate(-28 14 21)"/>
        <ellipse cx="26" cy="25" rx="5" ry="2.6" transform="rotate(28 26 25)"/>
        <ellipse cx="20" cy="6" rx="3" ry="4"/>
      </g>`);
    case "bellota": return v(`
      <path d="M20 14c5 0 8 4 8 9s-4 12-8 12-8-7-8-12 3-9 8-9Z" fill="#4FB3E0"/>
      <path d="M11 13c0-3 4-5 9-5s9 2 9 5-4 4-9 4-9-1-9-4Z" fill="#0E5C86"/>
      <path d="M20 8V4" stroke="#0E5C86" stroke-width="1.8" stroke-linecap="round"/>`);
    case "moras": return v(`
      <path d="M20 4c-2 8-4 14-8 20" stroke="#0E5C86" stroke-width="1.4" fill="none" stroke-linecap="round"/>
      <g fill="${color}">
        <circle cx="13" cy="26" r="3.4"/><circle cx="20" cy="29" r="3"/>
        <circle cx="25" cy="22" r="2.8"/><circle cx="17" cy="19" r="2.6"/>
      </g>`);
  }
}

const TIPOS  = ["simple","larga","roble","maple","rama","simple","larga","maple"];
const FRUTOS = ["bellota","moras"];

function nuevaHoja(){
  const tipo = Math.random() < .1
    ? FRUTOS[Math.floor(Math.random()*FRUTOS.length)]
    : TIPOS[Math.floor(Math.random()*TIPOS.length)];
  return hoja(tipo, PALETA[Math.floor(Math.random()*PALETA.length)]);
}

/* ═══════════════════════════════════════════════════
   Corazón hecho de hojas
   ═══════════════════════════════════════════════════ */
function dentro(x,y){
  const a = x*x + y*y - 1;
  return a*a*a - x*x*y*y*y <= 0;
}

function corazon(mini){
  const el = document.createElement("div");
  el.className = "heart" + (mini ? " mini" : "");
  const total = mini ? 26 : 54;
  const puestas = [];
  let intentos = 0;

  while(puestas.length < total && intentos < 4000){
    intentos++;
    const x = Math.random()*2.9 - 1.45;
    const y = Math.random()*2.7 - 1.25;
    if(!dentro(x,y)) continue;

    const px = (x + 1.45) / 2.9;
    const py = 1 - ((y + 1.25) / 2.7);
    const tam = (mini ? 12 : 17) + Math.random() * (mini ? 12 : 22);

    if(puestas.some(p => Math.hypot((p.px-px)*300,(p.py-py)*280) < tam*0.52)) continue;
    puestas.push({px,py,tam});

    const d = document.createElement("div");
    d.className = "hl";
    d.style.cssText =
      `left:${px*100}%;top:${py*100}%;width:${tam}px;height:${tam}px;` +
      `--rot:${Math.round(Math.random()*360)}deg;` +
      `animation-delay:${(puestas.length*0.012).toFixed(2)}s;`;
    d.innerHTML = nuevaHoja();
    el.appendChild(d);
  }
  return el;
}

/* ═══════════════════════════════════════════════════
   Lluvia de hojas
   ═══════════════════════════════════════════════════ */
const capa = document.getElementById("fall");
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;

let pausaHojas = false;

function caer(rapida){
  if(reduce || document.hidden || pausaHojas) return;
  const tam = 15 + Math.random()*24;
  const dur = (rapida ? 5 : 9) + Math.random()*8;

  const d = document.createElement("div");
  d.className = "fl";
  d.style.cssText =
    `left:${Math.random()*100}%;width:${tam}px;height:${tam}px;` +
    `--dx:${Math.random()*260-130}px;--dur:${dur}s;`;

  const sw = document.createElement("div");
  sw.className = "sw";
  sw.style.cssText = `--sw:${8+Math.random()*22}px;--swd:${(2.6+Math.random()*2.4).toFixed(1)}s;`;

  const sp = document.createElement("div");
  sp.className = "sp";
  sp.style.cssText = `--spin:${Math.round(Math.random()*720-360)}deg;`;
  sp.innerHTML = nuevaHoja();

  sw.appendChild(sp); d.appendChild(sw); capa.appendChild(d);
  setTimeout(()=>d.remove(), dur*1000 + 400);
}

for(let i=0;i<8;i++) setTimeout(()=>caer(false), i*420);
setInterval(()=>{ if(capa.childElementCount < 28) caer(false); }, 1200);
function ventisca(n){ for(let i=0;i<n;i++) setTimeout(()=>caer(true), i*70); }

/* ═══════════════════════════════════════════════════
   Armado de la carta
   ═══════════════════════════════════════════════════ */
const cover = document.getElementById("cover");
const carta = document.getElementById("carta");
const audio = document.getElementById("audio");
const sound = document.getElementById("sound");

audio.src = CONFIG.cancion;
audio.volume = 0;

let audioRoto = false;

function subirVolumen(tope){
  const paso = tope / 50;
  const t = setInterval(()=>{
    audio.volume = Math.min(tope, audio.volume + paso);
    if(audio.volume >= tope - 0.001) clearInterval(t);
  }, 50);
}

function avisar(texto){
  const a = document.createElement("div");
  a.className = "aviso";
  a.textContent = texto;
  document.body.appendChild(a);
  setTimeout(()=>a.classList.add("off"), 7000);
  setTimeout(()=>a.remove(), 7600);
}

audio.addEventListener("error", ()=>{
  audioRoto = true;
  sound.classList.add("muted");
  avisar("No encuentro " + CONFIG.cancion.replace("./","") + " en esta carpeta.");
});

function iconoSonido(){
  sound.classList.toggle("muted", audio.paused || audio.muted);
}

function sonar(){
  if(audioRoto) return;
  const p = audio.play();
  if(p && p.then){
    p.then(()=>{ subirVolumen(0.5); iconoSonido(); })
     .catch(()=>{ audio.volume = 0.5; iconoSonido(); });
  }else{
    audio.volume = 0.5; iconoSonido();
  }
}

function bloqueFotos(fotos){
  const cont = document.createElement("div");
  cont.className = "shots" + (fotos.length === 1 ? " one" : "");
  cont.innerHTML = fotos.map((f,i)=>{
    const nombre = f.src.replace(/^\.\//,"");
    return `<figure class="shot">
      <span class="frame" style="--tilt:${i%2 ? 1.6 : -1.6}deg">
        <img src="${f.src}" alt="${f.pie||''}" loading="lazy"
             onerror="this.parentNode.innerHTML='<span class=\\'miss\\'>Espacio para<br><b>${nombre}</b></span>'">
      </span>
      ${f.pie ? `<figcaption class="cap">${f.pie}</figcaption>` : ""}
    </figure>`;
  }).join("");
  return cont;
}

/* — portada — */
cover.appendChild(corazon(false));
cover.insertAdjacentHTML("beforeend",
  `<div class="over">${CONFIG.portada.encima}</div>
   <div class="script">${CONFIG.portada.titulo}</div>
   <p class="body">${CONFIG.portada.pie}</p>
   <button class="btn" id="abrir">${CONFIG.portada.boton}</button>`);

/* — secciones — */
CONFIG.paginas.forEach((pg,i) => {
  const s = document.createElement("section");
  s.className = "sec";

  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML =
    `<div class="over">${pg.encima}</div>` +
    `<h2 class="script sm">${pg.titulo}</h2>` +
    `<hr class="rule">` +
    (pg.texto||[]).map(t=>`<p class="body">${t}</p>`).join("");
  if(pg.fotos && pg.fotos.length) card.appendChild(bloqueFotos(pg.fotos));
  s.appendChild(card);

  if(i === 0){
    s.insertAdjacentHTML("beforeend",
      `<div class="hint" id="hint">
         <span>sigue bajando</span>
         <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
       </div>`);
  }
  carta.appendChild(s);
});

/* — final — */
const fin = document.createElement("section");
fin.className = "sec";
const cardFin = document.createElement("div");
cardFin.className = "card";
cardFin.appendChild(corazon(true));
cardFin.insertAdjacentHTML("beforeend",
  `<div class="script">${CONFIG.final.titulo}</div>
   <p class="body">${CONFIG.final.texto}</p>
   <div class="over" style="margin-top:20px">${CONFIG.firma}</div>
   <button class="btn ghost" id="otra">Volver al principio</button>`);
fin.appendChild(cardFin);
carta.appendChild(fin);

/* — cada sección aparece al entrar en pantalla — */
const secciones = [...document.querySelectorAll(".sec")];
const ojo = new IntersectionObserver(es => {
  es.forEach(e => {
    if(e.isIntersecting && !e.target.classList.contains("seen")){
      e.target.classList.add("seen");
      ventisca(8);
      const h = e.target.querySelector(".heart");
      if(h) h.replaceWith(corazon(h.classList.contains("mini")));
    }
  });
}, {threshold:0.45});
function observar(){ secciones.forEach(s => ojo.observe(s)); }

/* — el corazón se deshace en hojas — */
function fragmentar(h){
  h.querySelectorAll(".hl").forEach(el => {
    const rot = el.style.getPropertyValue("--rot");

    /* 1. congelar la hoja tal como se ve ahora */
    el.style.animation = "none";
    el.style.opacity = "1";
    el.style.transform = `translate(-50%,-50%) rotate(${rot}) scale(1)`;
    el.style.willChange = "transform,opacity";
    void el.offsetWidth;                       // el navegador toma nota

    /* 2. lanzarla hacia afuera */
    const px = parseFloat(el.style.left);
    const py = parseFloat(el.style.top);
    const vx = px - 50, vy = py - 54;
    const len = Math.hypot(vx,vy) || 1;
    const fuerza = 120 + Math.random()*320;
    const x = (vx/len)*fuerza + (Math.random()*70 - 35);
    const y = (vy/len)*fuerza*0.5 + 150 + Math.random()*320;
    const giro = Math.random()*760 - 380;

    el.style.transition =
      "transform 1.3s cubic-bezier(.16,.6,.35,1), opacity 1.3s ease-in";
    el.style.transitionDelay = (Math.random()*0.25).toFixed(2) + "s";
    el.style.transform =
      `translate(-50%,-50%) translate(${x.toFixed(0)}px,${y.toFixed(0)}px) ` +
      `rotate(${rot}) rotate(${giro.toFixed(0)}deg) ` +
      `scale(${(0.5 + Math.random()*0.5).toFixed(2)})`;
    el.style.opacity = "0";
  });
}

function entrarALaCarta(){
  cover.style.display = "none";
  document.body.classList.add("abierta");
  document.documentElement.classList.add("abierta");
  window.scrollTo(0,0);
  observar();
}

/* — abrir la carta — */
document.getElementById("abrir").onclick = (e)=>{
  e.currentTarget.disabled = true;
  sound.classList.add("show");
  sonar();

  if(reduce){ entrarALaCarta(); return; }

  const fold = document.getElementById("fold");
  const h = cover.querySelector(".heart");
  if(h) fragmentar(h);
  ventisca(20);

  cover.querySelectorAll(".over,.script,.body,.btn").forEach((el,i)=>{
    el.style.transition = "opacity .55s ease, transform .55s ease";
    el.style.transitionDelay = (i*0.05).toFixed(2) + "s";
    el.style.opacity = "0";
    el.style.transform = "translateY(-10px)";
  });

  setTimeout(()=>{
    pausaHojas = true;                         // el papel se abre sin carga extra
    fold.classList.add("on"); void fold.offsetWidth;
    fold.classList.add("up");
  }, 1150);
  setTimeout(entrarALaCarta, 2350);
  setTimeout(()=>{ fold.classList.add("away"); }, 2450);
  setTimeout(()=>{ pausaHojas = false; ventisca(8); }, 3100);
  setTimeout(()=>{ fold.remove(); }, 3400);
};

document.getElementById("otra").onclick = ()=>{
  carta.firstElementChild.scrollIntoView({behavior:"smooth"});
};

/* — se va la pista de "sigue bajando" al primer scroll — */
addEventListener("scroll", ()=>{
  const h = document.getElementById("hint");
  if(h && scrollY > 40) h.classList.add("off");
}, {passive:true});

sound.onclick = ()=>{
  if(audioRoto){
    avisar("No encuentro " + CONFIG.cancion.replace("./","") + " en esta carpeta.");
    return;
  }
  if(audio.paused){ audio.muted = false; sonar(); }
  else { audio.pause(); }
  iconoSonido();
  sound.setAttribute("aria-label", audio.paused ? "Poner música" : "Quitar música");
};

document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) ventisca(3); });
</script>
</body>
</html>
